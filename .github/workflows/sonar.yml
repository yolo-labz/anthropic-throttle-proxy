name: SonarQube scan

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Community has one project branch: PRs validate reports but NEVER publish.
# All main publishers share a concurrency group; unrelated PRs cannot cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Refuse non-main manual publication
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: echo 'Community publication is main-only.' >&2; exit 1

      - name: Checkout (full history for blame-based new-code detection)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv + Python 3.13
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.9.2"
          python-version: "3.13"

      - name: Install dependencies (locked)
        run: uv sync --frozen --group dev

      - name: Run tests with coverage and validate source/report receipt
        env:
          REVISION: ${{ github.sha }}
        run: |
          uv run ruff check scripts/check-sonar-report.py
          uv run ruff format --check scripts/check-sonar-report.py
          started=$(date +%s)
          uv run pytest --cov --cov-fail-under=80 --cov-report=xml --cov-report=term-missing
          uv run python scripts/check-sonar-report.py --revision "$REVISION" \
            --not-before "$started" --output report/sonar-source.json

      - name: Require configured main publisher
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_HOST_URL" || { echo 'SONAR_HOST_URL is required.' >&2; exit 1; }
          test -n "$SONAR_TOKEN" || { echo 'SONAR_TOKEN is required.' >&2; exit 1; }

      - name: SonarQube main scan (post-merge alarm, not a PR gate)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: SonarSource/sonarqube-scan-action@59db25f34e16620e48ab4bb9e4a5dce155cb5432 # v8.0.0
        with:
          args: -Dsonar.qualitygate.wait=true -Dsonar.scm.revision=${{ github.sha }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Preserve report and publication receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-receipts-${{ github.sha }}
          path: |
            coverage.xml
            report/sonar-source.json
            .scannerwork/report-task.txt
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
