name: OSV-Scanner

# Dependency vulnerability scanning (release-eng rule 6 in this org): OSV-Scanner
# V2 over the Python dependency graph (uv.lock). This is a Python repo, so there
# is no govulncheck to drop (rule: OSV-Scanner V2 invokes govulncheck internally
# only on Go repos). Findings surface as SARIF in the Security tab; the scan is
# continue-on-error so a fresh advisory never hard-blocks a PR — triage in-tab.

on:
  pull_request:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout source for the scan.
      security-events: write # upload SARIF to GitHub Security tab.
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        continue-on-error: true
        with:
          scan-args: |-
            --recursive
            --format sarif
            --output results.sarif
            .

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
