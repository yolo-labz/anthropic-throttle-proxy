name: CI

# Required status gate: a PR is red unless ruff (lint + format) and the full
# pytest suite pass. No `|| true`, no skip-swallow — the checks actually run.
# Coverage stays in sonar.yml (advisory); this gate runs pytest without
# coverage so it is fast and not a wasteful second coverage pass.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

# Deny-all at workflow scope; each job re-grants the minimum it needs.
permissions: {}

# Cancel superseded runs on the same ref (new push to a PR voids the old run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv + Python 3.13
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.2" # pin the uv binary (matches Dockerfile) for reproducible resolution
          python-version: "3.13"

      - name: Install dependencies (locked)
        run: uv sync --frozen --group dev

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Pytest
        run: uv run pytest -q
