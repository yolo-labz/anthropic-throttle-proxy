name: sonar gate diag (throwaway)
on: push
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the gate for an analysis this token submitted
        env:
          HOST: ${{ vars.SONAR_HOST_URL }}
          TOKEN: ${{ secrets.SONAR_TOKEN }}
          AID: acf42a43-83e8-4227-9340-5c1078b2d31b
        run: |
          set -u
          code=$(curl -sS -u "$TOKEN:" -o /tmp/g.json -w '%{http_code}' "$HOST/api/qualitygates/project_status?analysisId=$AID")
          echo "http=$code"
          jq -r '.projectStatus.status' /tmp/g.json 2>/dev/null
          echo "--- conditions ---"
          jq -r '.projectStatus.conditions[]? | "\(.status)\t\(.metricKey)\tactual=\(.actualValue)\tthreshold=\(.errorThreshold // "-")"' /tmp/g.json 2>/dev/null
          echo "--- raw ---"
          head -c 1500 /tmp/g.json
