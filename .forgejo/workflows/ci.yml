# Forgejo CI-of-record (fleet migration off GitHub Actions, 22/10/2026).
# `.forgejo/` is invisible to GitHub → zero GitHub dispatch/billing. Runs on the
# fleet runner's `ubuntu-latest` act container (the host lane mounts the job
# workdir without exec, so wheel binaries like ruff in .venv fail with EACCES —
# measured run 6, 22/10). Forgejo's own `CI / ruff-pytest` job status is the
# required check on protected `main`; GitHub is a main-only push mirror.
# Keep the job id stable: it is the status context identity.
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  ruff-pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv + Python 3.13
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0 (no floating v8 tag)
        with:
          version: "0.9.2"
          python-version: "3.13"
      - name: Sync (locked)
        run: uv sync --frozen --group dev
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Ruff format check
        run: uv run ruff format --check src tests
      - name: Pytest
        run: uv run pytest -q -p no:cacheprovider
