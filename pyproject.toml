[project]
name = "throttler-gateway"
version = "0.1.0"
description = "Throttler — self-hosted gateway and ingress for fleet-wide pacing, admission and subscription capacity."
authors = [{ name = "Pedro Balbino", email = "phsb5321@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.10",
    "aiohttp-jinja2>=1.6",
    "jinja2>=3.1",
    "prometheus-client>=0.21",
    "pyyaml>=6.0",
]

[project.scripts]
throttler-gateway = "throttler_gateway.gateway:main"
throttler-ingress = "throttler_gateway.ingress:main"
# Existing Nix services and clients retain their console entry points.
anthropic-throttle-proxy = "anthropic_throttle_proxy.proxy:main"
anthropic-throttle-ingress = "anthropic_throttle_proxy.ingress:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
]
# The browser-receipt delivery gate (specs/227-dashboard-audit/browser-receipt.py).
# Its own group rather than part of `dev`: `uv sync` installs `dev` by default,
# and this pulls a ~90 MB browser backend for a gate that CI deliberately does
# not run. `uv sync --group delivery` when you want to run it.
delivery = [
    "playwright>=1.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/throttler_gateway", "src/anthropic_throttle_proxy"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]  # asserts in tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
# relative_files is REQUIRED so SonarQube matches coverage.xml paths to its
# source tree — absolute paths silently report 0% coverage in CI.
relative_files = true
source = ["src/anthropic_throttle_proxy", "scripts", "specs"]

[tool.coverage.report]
# Acceptance tools live in non-package spec directories; count them even unimported.
include_namespace_packages = true
